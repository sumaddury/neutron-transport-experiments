# conda recipe: OpenMC "diff-geom" branch (geometric derivatives), built as a
# real conda package. Adapted from conda-forge/openmc-feedstock (recipe.yaml),
# minus the DAGMC and MPI variants this project does not use. Built with XDG
# (mesh geometry, from ../xdg-geometry) for surface_mesh's vertex derivatives.
#
# To change the OpenMC version used: edit `commit` below, and set the
# `.devYYYYMMDD` part of `version` to that commit's date. Builds of different
# commits otherwise share one version, and conda may install the older one.
schema_version: 1

context:
  repo: https://github.com/pshriwise/openmc.git      # branch: diff-geom
  commit: 823d609ffad148bc3d07336d2176afb42a00524a   # diff-geom head, 2026-10-30
  version: "0.16.1.dev20261030"
  build_number: 1

package:
  name: openmc-diffgeom
  version: ${{ version }}

source:
  git: ${{ repo }}
  rev: ${{ commit }}

build:
  number: ${{ build_number }}
  string: py${{ python | version_to_buildstring }}_g${{ commit[:9] }}_${{ build_number }}
  skip:
    - win
  script:
    file: build.sh
    env:
      OPENMC_COMMIT: ${{ commit }}
      OPENMC_VERSION: ${{ version }}

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake
    - make
    - pkg-config
    - git
    - if: linux
      then: libgomp
  host:
    - python
    - pip
    - setuptools
    - setuptools_scm
    - numpy
    - fmt
    - pugixml
    - libpng
    - hdf5 * nompi_*
    - h5py * nompi_*
    - xdg-geometry
    - eigen >=3.4,<4         # MOAB headers (via XDG) include Eigen (build-time only)
    - if: osx
      then: llvm-openmp
  run:
    - python
    - xdg-geometry
    - hdf5 * nompi_*
    - h5py * nompi_*
    - libpng
    - numpy
    - scipy
    - pandas
    - matplotlib-base
    - lxml
    - endf
    - uncertainties
    - ipython

tests:
  - python:
      imports:
        - openmc
        - openmc.lib
  - script:
      - openmc --version
      - python -c "import openmc; openmc.GeometricDerivative"
      - python -c "import openmc.lib; assert openmc.lib.feature_enabled('xdg')"

about:
  homepage: https://github.com/pshriwise/openmc
  summary: OpenMC with geometric (surface-coefficient) derivatives, branch diff-geom
  license: MIT
